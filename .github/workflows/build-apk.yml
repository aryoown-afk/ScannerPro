name: Build Binance Spot Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q BinanceSpotScannerApp_Android_Project.zip -d extracted
          echo "Isi hasil extract:"
          find extracted -maxdepth 2 -type f | sort

      - name: Build APK
        working-directory: extracted/BinanceSpotScannerApp
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Binance-Spot-Scanner-APK
          path: extracted/BinanceSpotScannerApp/app/build/outputs/apk/debug/app-debug.apk
