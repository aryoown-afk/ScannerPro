name: Build Binance Spot Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check repository files
        run: |
          echo "=== FILE DI ROOT REPOSITORY ==="
          ls -la
          echo "=== FILE ZIP ==="
          find . -maxdepth 2 -type f -name "*.zip" -print

      - name: Extract Android project
        run: |
          mkdir -p extracted

          if [ -f "BinanceSpotScannerApp_Android_Project_FIXED.zip" ]; then
            echo "Menggunakan ZIP FIXED"
            unzip -q "BinanceSpotScannerApp_Android_Project_FIXED.zip" -d extracted

          elif [ -f "BinanceSpotScannerApp_Android_Project.zip" ]; then
            echo "Menggunakan ZIP ORIGINAL"
            unzip -q "BinanceSpotScannerApp_Android_Project.zip" -d extracted

          else
            echo "ERROR: ZIP project Android tidak ditemukan."
            exit 1
          fi

          echo "=== HASIL EXTRACT ==="
          find extracted -maxdepth 4 -type f | sort

      - name: Find
